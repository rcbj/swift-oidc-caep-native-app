#
# Releases the package. Swift Package Manager and the Swift Package Index read
# versions from semantic-version git tags, so a release is a tag and a GitHub
# Release on main; nothing is uploaded anywhere.
#
# The Tests workflow has already succeeded for this commit on main (Linux and
# macOS). Release only when that commit is a pull request merged into main. A
# direct push stays unreleased. VERSION holds M.N, as install/appimage.sh and
# Demo/scripts/build-app.sh assume, and the tag is M.N.0. A tag that already
# exists is left there; the next release is a new minor number in VERSION.
name: publish

on:
  workflow_run:
    workflows: ["Tests"]
    types: [completed]
    branches: [main]

permissions:
  contents: read

jobs:
  release:
    if: >
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: read
    steps:
      - name: Require a pull request merged into main
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -eu
          count=$(gh api \
            -H "Accept: application/vnd.github+json" \
            "repos/${GITHUB_REPOSITORY}/commits/${SHA}/pulls" \
            --jq '[.[] | select(.base.ref == "main" and .merged_at != null)] | length')
          if [ "$count" = "0" ]; then
            echo "This commit on main did not come from a merged pull request."
            echo "release=false" >> "$GITHUB_OUTPUT"
          else
            echo "release=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Tag and release
        if: steps.gate.outputs.release == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -eu
          version=$(gh api "repos/${GITHUB_REPOSITORY}/contents/VERSION?ref=${SHA}" \
            --jq '.content' | base64 -d | tr -d '[:space:]')
          if ! printf '%s' "$version" | grep -Eq '^[0-9]+\.[0-9]+$'; then
            echo "VERSION must be M.N; it is '${version}'."
            exit 1
          fi
          tag="${version}.0"
          if gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${tag}" >/dev/null 2>&1; then
            echo "${tag} is already released."
            exit 0
          fi
          gh release create "$tag" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$SHA" \
            --title "$tag" \
            --generate-notes
          echo "Released ${tag} at ${SHA}."
