#
# Swift Package Index settings. The DocC documentation is built on macOS, so
# the Apple-only types (Keychain, Secure Enclave, the system web
# authenticator) are included.
version: 1
builder:
  configs:
    - platform: macos-spm
      documentation_targets: [OIDCCAEPClient]
